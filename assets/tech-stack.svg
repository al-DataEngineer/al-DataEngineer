<svg width="420" height="420" viewBox="0 0 420 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="420" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18202c"/>
      <stop offset="100%" stop-color="#11161f"/>
    </linearGradient>
    <linearGradient id="pillBg" x1="0" y1="0" x2="0" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#222b3a"/>
      <stop offset="100%" stop-color="#171e29"/>
    </linearGradient>
    <style>
      .header {
        font-family: "JetBrains Mono", Consolas, monospace;
        font-size: 13px;
        fill: #cbd5e1;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 12.5px;
        font-weight: 600;
        fill: #e6edf3;
      }
    </style>
  </defs>

  <!-- Card Container -->
  <rect x="1" y="1" width="418" height="418" rx="12" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.4"/>
  <!-- File icon -->
  <rect x="18" y="12" width="11" height="14" rx="1.5" stroke="#8b949e" stroke-width="1.3" fill="none"/>
  <line x1="21" y1="17" x2="26" y2="17" stroke="#8b949e" stroke-width="1.2"/>
  <line x1="21" y1="21" x2="26" y2="21" stroke="#8b949e" stroke-width="1.2"/>
  <text x="37" y="23.5" class="header">tech_stack.yml</text>
  <line x1="1" y1="38" x2="419" y2="38" stroke="#30363d" stroke-width="1"/>

  <!-- Row 1: NumPy, Pandas, Matplotlib -->
  <g transform="translate(20, 52)">
    <rect width="108" height="34" rx="17" fill="url(#pillBg)" stroke="#30363d" stroke-width="1.1"/>
    <polygon points="20,10 27,14 27,22 20,26 13,22 13,14" fill="#4dabcf"/>
    <text x="36" y="21.5" class="pill-text">NumPy</text>
  </g>
  <g transform="translate(138, 52)">
    <rect width="114" height="34" rx="17" fill="url(#pillBg)" stroke="#30363d" stroke-width="1.1"/>
    <rect x="16" y="9" width="3.5" height="16" rx="1" fill="#e6edf3"/>
    <rect x="22" y="12" width="3.5" height="10" rx="1" fill="#e70488"/>
    <rect x="28" y="9" width="3.5" height="16" rx="1" fill="#ffca00"/>
    <text x="40" y="21.5" class="pill-text">Pandas</text>
  </g>
  <g transform="translate(262, 52)">
    <rect width="136" height="34" rx="17" fill="url(#pillBg)" stroke="#30363d" stroke-width="1.1"/>
    <circle cx="21" cy="17" r="7" fill="#11557c" stroke="#e6edf3" stroke-width="1.2"/>
    <path d="M21 17 L21 10 A7 7 0 0 1 27 20 Z" fill="#f97316"/>
    <text x="36" y="21.5" class="pill-text">Matplotlib</text>
  </g>

  <!-- Row 2: Seaborn, Scikit-Learn -->
  <g transform="translate(20, 96)">
    <rect width="126" height="34" rx="17" fill="url(#pillBg)" stroke="#30363d" stroke-width="1.1"/>
    <circle cx="21" cy="17" r="7" fill="#4c72b0"/>
    <path d="M15 19 Q21 13 27 18" stroke="#ffffff" stroke-width="1.5" fill="none"/>
    <text x="36" y="21.5" class="pill-text">Seaborn</text>
  </g>
  <g transform="translate(156, 96)">
    <rect width="150" height="34" rx="17" fill="url(#pillBg)" stroke="#30363d" stroke-width="1.1"/>
    <circle cx="20" cy="18" r="5" fill="#f89939"/>
    <circle cx="26" cy="15" r="4" fill="#3499cd"/>
    <text x="38" y="21.5" class="pill-text">Scikit-Learn</text>
  </g>

  <!-- Row 3: TensorFlow, PyTorch -->
  <g transform="translate(20, 140)">
    <rect width="144" height="34" rx="17" fill="url(#pillBg)" stroke="#30363d" stroke-width="1.1"/>
    <path d="M15 14 L22 10 L29 14 M22 10 V25 M22 17 L27 14" stroke="#ff6f00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="38" y="21.5" class="pill-text">TensorFlow</text>
  </g>
  <g transform="translate(174, 140)">
    <rect width="128" height="34" rx="17" fill="url(#pillBg)" stroke="#30363d" stroke-width="1.1"/>
    <path d="M22 10 C17 12 15 17 18 22 C21 25 26 24 27 19 C28 16 26 13 24 12" stroke="#ee4c2c" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="24.5" cy="10.5" r="1.5" fill="#ee4c2c"/>
    <text x="37" y="21.5" class="pill-text">PyTorch</text>
  </g>

  <!-- Row 4: AI Workflows, FastAPI -->
  <g transform="translate(20, 184)">
    <rect width="152" height="34" rx="17" fill="url(#pillBg)" stroke="#30363d" stroke-width="1.1"/>
    <circle cx="21" cy="17" r="6" stroke="#67e8f9" stroke-width="1.4" fill="none"/>
    <circle cx="21" cy="17" r="2" fill="#67e8f9"/>
    <text x="36" y="21.5" class="pill-text">AI Workflows</text>
  </g>
  <g transform="translate(182, 184)">
    <rect width="120" height="34" rx="17" fill="url(#pillBg)" stroke="#30363d" stroke-width="1.1"/>
    <circle cx="21" cy="17" r="7" fill="#05998b"/>
    <polygon points="22,12 18,18 21,18 20,22 24,16 21,16" fill="#ffffff"/>
    <text x="36" y="21.5" class="pill-text">FastAPI</text>
  </g>

  <!-- Row 5: Requests, BeautifulSoup -->
  <g transform="translate(20, 228)">
    <rect width="128" height="34" rx="17" fill="url(#pillBg)" stroke="#30363d" stroke-width="1.1"/>
    <circle cx="21" cy="17" r="6.5" stroke="#38bdf8" stroke-width="1.3" fill="none"/>
    <path d="M16 17 H26 M21 11 V23" stroke="#38bdf8" stroke-width="1.1"/>
    <text x="36" y="21.5" class="pill-text">Requests</text>
  </g>
  <g transform="translate(158, 228)">
    <rect width="164" height="34" rx="17" fill="url(#pillBg)" stroke="#30363d" stroke-width="1.1"/>
    <text x="15" y="21.5" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#4ade80">BS</text>
    <text x="39" y="21.5" class="pill-text">BeautifulSoup</text>
  </g>

  <!-- Row 6: SQL, PostgreSQL -->
  <g transform="translate(20, 272)">
    <rect width="98" height="34" rx="17" fill="url(#pillBg)" stroke="#30363d" stroke-width="1.1"/>
    <ellipse cx="21" cy="13" rx="6" ry="2.5" stroke="#60a5fa" stroke-width="1.3" fill="none"/>
    <path d="M15 13 V21 C15 22.5 27 22.5 27 21 V13" stroke="#60a5fa" stroke-width="1.3" fill="none"/>
    <text x="36" y="21.5" class="pill-text">SQL</text>
  </g>
  <g transform="translate(128, 272)">
    <rect width="144" height="34" rx="17" fill="url(#pillBg)" stroke="#30363d" stroke-width="1.1"/>
    <circle cx="21" cy="17" r="6.5" fill="#336791"/>
    <text x="21" y="20.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#ffffff">PG</text>
    <text x="36" y="21.5" class="pill-text">PostgreSQL</text>
  </g>

  <!-- Row 7: Excel -->
  <g transform="translate(20, 316)">
    <rect width="378" height="34" rx="17" fill="url(#pillBg)" stroke="#30363d" stroke-width="1.1"/>
    <rect x="15" y="10" width="14" height="14" rx="2" fill="#217346"/>
    <text x="22" y="20.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="800" fill="#ffffff">X</text>
    <text x="38" y="21.5" class="pill-text">Excel (VLOOKUP | XLOOKUP | HLOOKUP)</text>
  </g>

  <!-- Row 8: Spreadsheet, Word, Canva -->
  <g transform="translate(20, 360)">
    <rect width="142" height="34" rx="17" fill="url(#pillBg)" stroke="#30363d" stroke-width="1.1"/>
    <rect x="15" y="10" width="14" height="14" rx="2" fill="#0f9d58"/>
    <line x1="17" y1="15" x2="27" y2="15" stroke="#ffffff" stroke-width="1.1"/>
    <line x1="17" y1="19" x2="27" y2="19" stroke="#ffffff" stroke-width="1.1"/>
    <line x1="21" y1="12" x2="21" y2="22" stroke="#ffffff" stroke-width="1.1"/>
    <text x="37" y="21.5" class="pill-text">Spreadsheet</text>
  </g>
  <g transform="translate(172, 360)">
    <rect width="104" height="34" rx="17" fill="url(#pillBg)" stroke="#30363d" stroke-width="1.1"/>
    <rect x="15" y="10" width="14" height="14" rx="2" fill="#2b579a"/>
    <text x="22" y="20.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" font-weight="800" fill="#ffffff">W</text>
    <text x="37" y="21.5" class="pill-text">Word</text>
  </g>
  <g transform="translate(286, 360)">
    <rect width="112" height="34" rx="17" fill="url(#pillBg)" stroke="#30363d" stroke-width="1.1"/>
    <circle cx="22" cy="17" r="7" fill="#00c4cc"/>
    <text x="22" y="20.5" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-weight="700" fill="#ffffff">C</text>
    <text x="37" y="21.5" class="pill-text">Canva</text>
  </g>
